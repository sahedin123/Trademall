<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trademall</title>
  <!-- Link to the CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Trademall Live Trade</h1>

    <div class="trade-type">
      <button onclick="setTradeDuration(60)">1 Min Trade</button>
      <button onclick="setTradeDuration(180)">3 Min Trade</button>
    </div>

    <div class="trade-buttons">
      <button class="red">Join Red</button>
      <button class="green">Join Green</button>
      <button class="violet">Join Violet</button>
    </div>

    <div class="period">
      <h3>Current Period: #12345</h3>
      <p>Time Remaining: <span id="timer">02:59</span></p>
    </div>

    <div class="record">
      <h3>Parity Record</h3>
      <table>
        <thead>
          <tr><th>Period</th><th>Price</th><th>Number</th><th>Color</th></tr>
        </thead>
        <tbody id="parity-record">
          <tr><td>12344</td><td>₹9.99</td><td>4</td><td>Red</td></tr>
          <tr><td>12343</td><td>₹9.99</td><td>5</td><td>Violet</td></tr>
        </tbody>
      </table>
    </div>

    <div class="rules">
      <h3>Rules</h3>
      <p>1, 3, 7, 9 = Green (2x), 2, 4, 6, 8 = Red (2x), 0 = Half Red & Violet (1.5x and 4.5x), 5 = Half Green & Violet (1.5x and 4.5x)</p>
    </div>

    <div class="share">
      <h3>Share App</h3>
      <input type="text" id="appLink" value="https://trademall.app" readonly>
      <button onclick="copyLink()">Copy Link</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
